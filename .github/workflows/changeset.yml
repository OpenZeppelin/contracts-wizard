name: Changeset

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled

concurrency:
  group: changeset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ignore-changeset') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # Include history so Changesets finds merge-base
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Check changeset
        run: npx changeset status --since=origin/${{ github.base_ref }}
      - name: Check UI changesets include contracts-mcp
        run: node scripts/release/check-mcp-ui-changeset.mjs origin/${{ github.base_ref }}
